<!DOCTYPE html>
<html><head><title>Q6 CSS Grid Form</title><style>
.form{max-width:600px;margin:30px auto;display:grid;grid-template-columns:150px 1fr;gap:12px}
input,textarea{padding:8px}.full{grid-column:1/3}button{padding:10px}
</style></head><body>
<form class="form">
<label>Name</label><input type="text"><label>Email</label><input type="email">
<label>Phone</label><input type="tel"><label>Address</label><textarea></textarea>
<button class="full">Submit</button>
</form></body></html>
