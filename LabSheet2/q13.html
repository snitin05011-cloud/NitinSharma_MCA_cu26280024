<!DOCTYPE html>
<html><head><title>Q13 Custom Controls</title><style>
label{display:block;margin:12px}.check,.radio{display:none}.box{display:inline-block;width:18px;height:18px;border:2px solid #555;vertical-align:middle;margin-right:6px}
.check:checked~.box{background:#333}.radio:checked~.box{border-radius:50%;background:#333}
</style></head><body>
<label><input class="check" type="checkbox"><span class="box"></span>Accept terms</label>
<label><input class="radio" type="radio" name="g"><span class="box"></span>Male</label>
<label><input class="radio" type="radio" name="g"><span class="box"></span>Female</label>
</body></html>
