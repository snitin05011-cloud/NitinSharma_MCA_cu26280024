<!DOCTYPE html>
<html><head><title>Q2 Registration</title></head>
<body>
<form>
<h2>Student Registration</h2>
<input type="text" placeholder="Full name" required minlength="3" maxlength="40"><br><br>
<input type="email" placeholder="Email" required><br><br>
<input type="password" placeholder="Password" required minlength="8" maxlength="20"><br><br>
<input type="text" placeholder="10-digit mobile" pattern="[0-9]{10}" required><br><br>
<input type="text" placeholder="College name" required maxlength="80"><br><br>
<button type="submit">Register</button>
</form>
</body></html>
