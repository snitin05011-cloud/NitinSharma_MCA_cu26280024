<!DOCTYPE html>
<html><head><title>Q22 Newsletter</title><style>
.box{width:350px;margin:60px auto;position:relative}.box input{width:100%;padding:14px 10px;box-sizing:border-box}.box label{position:absolute;left:10px;top:14px;transition:.2s;background:white;padding:0 4px;color:#777;pointer-events:none}

</style></head><body><form class="box">

</form></body></html>
