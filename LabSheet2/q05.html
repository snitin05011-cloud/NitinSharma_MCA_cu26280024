<!doctype html>
<html>
  <head>
    <title>Q5 Login</title>
    <style>
      body {
        font-family: Arial;
        background: #eee;
      }
      .card {
        width: 350px;
        margin: 80px auto;
        padding: 30px;
        background: rgb(243, 243, 243);
        border-radius: 15px;
        box-shadow: 0 5px 20px #aaa;
        position: relative;
      }
      .badge {
        position: absolute;
        top: -12px;
        right: 20px;
        background: #c5b1b1;
        color: rgb(132, 62, 62);
        padding: 5px 10px;
        border-radius: 10px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">LOGIN</span>
      <h2>Welcome</h2>
      <input type="text" placeholder="Username" /><input
        type="password"
        placeholder="Password"
      /><button>Login</button>
    </div>
  </body>
</html>
