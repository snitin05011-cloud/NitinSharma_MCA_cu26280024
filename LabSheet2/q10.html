<!DOCTYPE html>
<html><head><title>Q10 Data Table</title><style>
.container{max-width:700px;margin:30px auto}.data{width:100%;border-collapse:collapse}.data th,.data td{border:1px solid #999;padding:10px}.data tr:nth-child(even){background:#eee}.data tr:hover{background:#ddd}
</style></head><body><form class="container"><table class="data">
<tr><th>Item</th><th>Quantity</th><th>Price</th></tr>
<tr><td>Notebook</td><td><input type="number" value="1"></td><td>50</td></tr>
<tr><td>Pen</td><td><input type="number" value="2"></td><td>20</td></tr>
<tr><td>Bag</td><td><input type="number" value="1"></td><td>500</td></tr>
</table><br><button>Save</button></form></body></html>
