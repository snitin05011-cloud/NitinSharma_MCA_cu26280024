<!DOCTYPE html>
<html>
<head>
  <title>Q1 Form</title>
  <link rel="stylesheet" href="q01.css">
</head>
<body>
  <form class="form">
    <h2>Basic Form</h2>
    <label>Name</label>
    <input type="text" placeholder="Enter name">

    <label>Password</label>
    <input type="password" placeholder="Enter password">

    <label>Gender</label>
    <div><input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female</div>

    <label>Skills</label>
    <div><input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript</div>

    <label>Course</label>
    <select><option>MCA</option><option>BCA</option><option>B.Tech</option></select>

    <label>Message</label>
    <textarea placeholder="Write message"></textarea>
    <button>Submit</button>
  </form>
</body>
</html>
