<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Mouse Events</title>
<style>#hoverBox{padding:50px;text-align:center;background:#e6e6e6;border:1px solid #777}</style></head><body>
<h2>Mouseover and Mouseout</h2><div id="hoverBox">Move your mouse over me</div>
<script>
const box = document.getElementById("hoverBox");
box.addEventListener("mouseover", () => box.style.backgroundColor = "lightblue");
box.addEventListener("mouseout", () => box.style.backgroundColor = "#e6e6e6");
</script></body></html>
