<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Dynamic Table Generator</title>
<style>table{border-collapse:collapse;margin-top:15px}td,th{border:1px solid #555;padding:8px}</style></head><body>
<h2>Dynamic Table Generator</h2>
<label>Rows <input id="rows" type="number" min="1" max="20" value="3"></label>
<label>Columns <input id="cols" type="number" min="1" max="10" value="4"></label>
<button id="generate">Generate table</button><div id="tableArea"></div>
<script>
document.getElementById("generate").addEventListener("click", () => {
  const rows = Number(document.getElementById("rows").value);
  const cols = Number(document.getElementById("cols").value);
  const area = document.getElementById("tableArea");
  area.replaceChildren();
  if (!Number.isInteger(rows) || !Number.isInteger(cols) || rows < 1 || rows > 20 || cols < 1 || cols > 10) {
    area.textContent = "Enter 1–20 rows and 1–10 columns."; return;
  }
  const table = document.createElement("table");
  for (let r = 0; r < rows; r++) {
    const tr = document.createElement("tr");
    for (let c = 0; c < cols; c++) {
      const td = document.createElement("td");
      td.textContent = `Row ${r + 1}, Column ${c + 1}`;
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  area.appendChild(table);
});
</script></body></html>
