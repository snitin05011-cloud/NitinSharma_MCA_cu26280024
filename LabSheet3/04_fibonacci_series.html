<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Fibonacci Series</title></head><body>
<h2>Fibonacci Series</h2>
<label>Number of terms: <input id="terms" type="number" min="1" max="100" value="10"></label>
<button id="generate">Generate</button><p id="result"></p>
<script>
document.getElementById("generate").addEventListener("click", () => {
  const n = Number(document.getElementById("terms").value);
  if (!Number.isInteger(n) || n < 1 || n > 100) {
    document.getElementById("result").textContent = "Enter 1 to 100 terms."; return;
  }
  const series = [];
  let a = 0, b = 1;
  for (let i = 0; i < n; i++) {
    series.push(a);
    [a, b] = [b, a + b];
  }
  document.getElementById("result").textContent = series.join(", ");
});
</script></body></html>
