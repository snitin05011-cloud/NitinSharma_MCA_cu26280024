<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Password Validation</title></head><body>
<h2>Password Match Validation</h2>
<form id="signup">
<label>Password: <input id="password" type="password" required></label><br>
<label>Confirm password: <input id="confirm" type="password" required></label>
<p id="message" aria-live="polite"></p><button type="submit">Submit</button>
</form>
<script>
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm");
const message = document.getElementById("message");
function validate() {
  if (!confirmPassword.value) { message.textContent = ""; confirmPassword.setCustomValidity(""); return; }
  const matches = password.value === confirmPassword.value;
  message.textContent = matches ? "Passwords match." : "Passwords do not match.";
  message.style.color = matches ? "green" : "red";
  confirmPassword.setCustomValidity(matches ? "" : "Passwords must match.");
}
password.addEventListener("input", validate);
confirmPassword.addEventListener("input", validate);
document.getElementById("signup").addEventListener("submit", event => {
  validate();
  if (!document.getElementById("signup").checkValidity()) { event.preventDefault(); confirmPassword.reportValidity(); }
  else { event.preventDefault(); message.textContent = "Form validated successfully."; }
});
</script></body></html>
